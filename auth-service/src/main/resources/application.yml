spring:
  application:
    name: echoroom-auth
  config:
    import:
      - optional:nacos:echoroom-shared.yaml?group=${NACOS_CONFIG_GROUP:ECHOROOM}&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:ECHOROOM}&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_CONFIG_ENABLED:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/echoroom?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:echoroom}
    password: ${DB_PASSWORD:echoroom}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${AUTH_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${AUTH_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:300000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}

server:
  port: ${SERVER_PORT:8081}

echoroom:
  auth:
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TTL:30d}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:echoroom_refresh}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    ws-ticket-ttl: ${AUTH_WS_TICKET_TTL:30s}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        echoroom.realtime.send.duration: true
        echoroom.wallet.lock.duration: true
        echoroom.gift.transaction.duration: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: redis-sentinel
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:echoroom}
        nodes: ${REDIS_SENTINEL_NODES:sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
