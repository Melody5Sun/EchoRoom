global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: streamhub
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - auth-service
    type: A
    port: 8081
  - names:
    - user-service
    type: A
    port: 8082
  - names:
    - live-service
    type: A
    port: 8083
  - names:
    - gateway-service
    type: A
    port: 8088
  - names:
    - realtime-gateway
    type: A
    port: 8090
- job_name: mysql-exporter
  static_configs:
  - targets:
    - mysql-exporter:9104
- job_name: redis-exporter
  static_configs:
  - targets:
    - redis-exporter:9121
- job_name: node-exporter
  static_configs:
  - targets:
    - node-exporter:9100
