spring:
  application:
    name: streamhub-live
  config:
    import:
      - optional:nacos:streamhub-shared.yaml?group=${NACOS_CONFIG_GROUP:STREAMHUB}&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:STREAMHUB}&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_CONFIG_ENABLED:true}
    openfeign:
      client:
        config:
          streamhub-user:
            connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${USER_SERVICE_READ_TIMEOUT_MS:2000}
            logger-level: basic
      httpclient:
        hc5:
          enabled: true
        max-connections: ${USER_SERVICE_HTTP_MAX_CONNECTIONS:200}
        max-connections-per-route: ${USER_SERVICE_HTTP_MAX_CONNECTIONS_PER_ROUTE:100}
        time-to-live: ${USER_SERVICE_HTTP_CONNECTION_TTL_MS:300000}
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/streamhub?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:streamhub}
    password: ${DB_PASSWORD:streamhub}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${LIVE_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${LIVE_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:300000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}

server:
  tomcat:
    threads:
      max: ${LIVE_HTTP_THREADS:128}
      min-spare: 8
    accept-count: ${LIVE_HTTP_ACCEPT_COUNT:32}
  port: ${SERVER_PORT:8083}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        streamhub.realtime.send.duration: true
        streamhub.wallet.lock.duration: true
        streamhub.gift.transaction.duration: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

streamhub:
  traffic:
    mode: ${STREAMHUB_TRAFFIC_MODE:enforce}
    max-inflight: ${STREAMHUB_TRAFFIC_MAX_INFLIGHT:128}
    seckill:
      user-rate: ${SECKILL_USER_RATE:2}
      user-burst: ${SECKILL_USER_BURST:4}
      scope-rate: ${SECKILL_ACTIVITY_RATE:100}
      scope-burst: ${SECKILL_ACTIVITY_BURST:200}
    gift:
      user-rate: ${GIFT_USER_RATE:5}
      user-burst: ${GIFT_USER_BURST:10}
      scope-rate: ${GIFT_ROOM_RATE:100}
      scope-burst: ${GIFT_ROOM_BURST:200}
    chat:
      user-rate: ${CHAT_USER_RATE:3}
      user-burst: ${CHAT_USER_BURST:5}
      scope-rate: ${CHAT_ROOM_RATE:100}
      scope-burst: ${CHAT_ROOM_BURST:200}
  cache:
    enabled: ${STREAMHUB_CACHE_ENABLED:true}
    ttl-seconds: ${STREAMHUB_CACHE_TTL_SECONDS:30}
    max-loaders: ${STREAMHUB_CACHE_MAX_LOADERS:16}
  media:
    rtmp-publish-base: ${MEDIA_RTMP_PUBLISH_BASE:rtmp://localhost:1935/live/}
    http-flv-play-base: ${MEDIA_HTTP_FLV_PLAY_BASE:/live/}
    webrtc-play-base: ${MEDIA_WEBRTC_PLAY_BASE:/rtc/v1/whep/?app=live&stream=}
  realtime:
    channel-mode: ${STREAMHUB_REALTIME_CHANNEL_MODE:room}
    unsubscribe-delay-ms: ${STREAMHUB_UNSUBSCRIBE_DELAY_MS:30000}
    max-sessions: ${STREAMHUB_MAX_SESSIONS:20000}
    async-send: ${STREAMHUB_ASYNC_SEND:true}
    send-threads: ${STREAMHUB_SEND_THREADS:16}
    send-queue-messages: ${STREAMHUB_SEND_QUEUE_MESSAGES:256}
    send-queue-bytes: ${STREAMHUB_SEND_QUEUE_BYTES:262144}
    send-node-bytes: ${STREAMHUB_SEND_NODE_BYTES:67108864}
    send-timeout-ms: ${STREAMHUB_SEND_TIMEOUT_MS:5000}
    channel: ${STREAMHUB_REALTIME_CHANNEL:live:room:events}
    node-id: ${STREAMHUB_NODE_ID:${HOSTNAME:}}
    max-sessions-per-room: ${STREAMHUB_MAX_SESSIONS_PER_ROOM:10000}
    max-chat-events-per-second: ${STREAMHUB_MAX_CHAT_EVENTS_PER_SECOND:1000}
    session-timeout-ms: ${STREAMHUB_SESSION_TIMEOUT_MS:75000}
    session-scan-interval-ms: ${STREAMHUB_SESSION_SCAN_INTERVAL_MS:15000}
    presence-ttl-ms: ${STREAMHUB_PRESENCE_TTL_MS:90000}
  reconciliation:
    enabled: ${STREAMHUB_RECONCILIATION_ENABLED:true}
    fixed-delay-ms: ${STREAMHUB_RECONCILIATION_FIXED_DELAY_MS:60000}
    pending-age-ms: ${STREAMHUB_RECONCILIATION_PENDING_AGE_MS:30000}
    batch-size: ${STREAMHUB_RECONCILIATION_BATCH_SIZE:100}
    lock-key: ${STREAMHUB_RECONCILIATION_LOCK_KEY:streamhub:lock:reconciliation}
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
    gift-topic: ${ROCKETMQ_GIFT_TOPIC:STREAMHUB_GIFT_ORDER}
    gift-producer-group: ${ROCKETMQ_GIFT_PRODUCER_GROUP:streamhub-gift-producer}
    gift-consumer-group: ${ROCKETMQ_GIFT_CONSUMER_GROUP:streamhub-gift-consumer}
    activity-topic: ${ROCKETMQ_ACTIVITY_TOPIC:STREAMHUB_ACTIVITY_ORDER}
    activity-producer-group: ${ROCKETMQ_ACTIVITY_PRODUCER_GROUP:streamhub-activity-producer}
    activity-consumer-group: ${ROCKETMQ_ACTIVITY_CONSUMER_GROUP:streamhub-activity-consumer-v2}
    timeout-delay-level: ${ROCKETMQ_ACTIVITY_TIMEOUT_DELAY_LEVEL:3}
    consume-thread-min: ${ROCKETMQ_CONSUME_THREAD_MIN:4}
    consume-thread-max: ${ROCKETMQ_CONSUME_THREAD_MAX:8}
    consume-message-batch-max-size: ${ROCKETMQ_CONSUME_BATCH_MAX_SIZE:1}
    max-reconsume-times: ${ROCKETMQ_MAX_RECONSUME_TIMES:5}
    producer-retry-times: ${ROCKETMQ_PRODUCER_RETRY_TIMES:2}
    dead-letter-enabled: ${ROCKETMQ_DEAD_LETTER_ENABLED:true}
    dead-letter-consumer-group: ${ROCKETMQ_DEAD_LETTER_CONSUMER_GROUP:streamhub-dead-letter-auditor}
    outbox-enabled: ${ROCKETMQ_OUTBOX_ENABLED:true}
    outbox-batch-size: ${ROCKETMQ_OUTBOX_BATCH_SIZE:100}
    outbox-max-attempts: ${ROCKETMQ_OUTBOX_MAX_ATTEMPTS:20}
    outbox-base-retry-delay-ms: ${ROCKETMQ_OUTBOX_BASE_RETRY_DELAY_MS:1000}
    outbox-fixed-delay-ms: ${ROCKETMQ_OUTBOX_FIXED_DELAY_MS:500}
    metrics-refresh-ms: ${ROCKETMQ_METRICS_REFRESH_MS:15000}
    lag-monitor-initial-delay-ms: ${ROCKETMQ_LAG_MONITOR_INITIAL_DELAY_MS:15000}
    lag-monitor-fixed-delay-ms: ${ROCKETMQ_LAG_MONITOR_FIXED_DELAY_MS:15000}

---
spring:
  config:
    activate:
      on-profile: redis-sentinel
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:streamhub}
        nodes: ${REDIS_SENTINEL_NODES:sentinel-1:26379,sentinel-2:26379,sentinel-3:26379}
