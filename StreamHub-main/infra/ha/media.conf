events {}
http {
  upstream media { server srs-1:8080; server srs-2:8080 backup; }
  upstream rtc { server srs-1:1985; server srs-2:1985 backup; }
  server { listen 8080; location / { proxy_pass http://media; proxy_buffering off; proxy_read_timeout 1h; } }
  server { listen 1985; location / { proxy_pass http://rtc; } }
}
